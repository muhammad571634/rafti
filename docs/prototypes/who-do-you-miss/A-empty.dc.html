<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invitation card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
body{margin:0}
.ph{width:390px;height:440px;background:#09090D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Roboto,'Segoe UI',Helvetica,Arial,sans-serif;overflow:hidden;position:relative}
.feat{position:absolute;left:20px;top:-150px;width:262px;height:240px;border-radius:28px;background:linear-gradient(180deg,#3a2a20,#1a1410)}
.sec{position:absolute;left:20px;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:22px;line-height:28px;letter-spacing:-.25px}
.card{position:absolute;left:20px;top:166px;width:350px;height:148px;box-sizing:border-box;border-radius:28px;background:#16161E;border:.5px solid rgba(255,255,255,.08);overflow:hidden;display:flex;align-items:center;gap:6px;padding:0 18px 0 8px}
.glow{position:absolute;left:-30px;top:-40px;width:230px;height:230px;background:radial-gradient(circle at 50% 50%,rgba(232,116,156,.22),rgba(232,181,58,.08) 45%,rgba(9,9,13,0) 70%)}
.folk{position:relative;width:150px;height:120px;flex:none}
.p{position:absolute;bottom:0;animation:breathe 4.2s ease-in-out infinite;transform-origin:50% 100%}
.p2{animation-delay:1.1s}.p3{animation-delay:2.2s}
@keyframes breathe{0%,100%{opacity:.78;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
.side{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:12px;position:relative}
.h{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:22px;line-height:27px;letter-spacing:-.25px}
.pill{height:40px;padding:0 20px;border-radius:20px;background:#fff;color:#000;border:0;font:inherit;font-size:15px;font-weight:600}
.tag{position:absolute;top:110px;right:16px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#09090D;background:#FFC497;border-radius:10px;padding:3px 8px}
</style>
</helmet>
<div class="ph">
  <div class="feat"></div>
  <div class="sec" style="top:124px">Who do you miss?</div>
  <div class="card">
    <div class="glow"></div>
    <div class="folk" aria-hidden="true">
      <svg class="p p2" style="left:6px;width:62px;height:76px" viewBox="0 0 60 74"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8B53A" stop-opacity=".95"></stop><stop offset="1" stop-color="#E8B53A" stop-opacity=".12"></stop></linearGradient></defs><circle cx="30" cy="20" r="12" fill="url(#ga)"></circle><path d="M6 74 C6 52 17 40 30 40 C43 40 54 52 54 74 Z" fill="url(#ga)"></path></svg>
      <svg class="p" style="left:42px;width:76px;height:100px" viewBox="0 0 60 79"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8749C"></stop><stop offset="1" stop-color="#E8749C" stop-opacity=".14"></stop></linearGradient></defs><circle cx="30" cy="20" r="13" fill="url(#gb)"></circle><path d="M4 79 C4 54 16 41 30 41 C44 41 56 54 56 79 Z" fill="url(#gb)"></path></svg>
      <svg class="p p3" style="left:104px;width:46px;height:56px" viewBox="0 0 60 73"><defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6E9BFF"></stop><stop offset="1" stop-color="#6E9BFF" stop-opacity=".14"></stop></linearGradient></defs><circle cx="30" cy="22" r="14" fill="url(#gc)"></circle><path d="M7 73 C7 53 17 43 30 43 C43 43 53 53 53 73 Z" fill="url(#gc)"></path></svg>
    </div>
    <div class="side">
      <div class="h">Talk to them again</div>
      <button class="pill">Choose</button>
    </div>
  </div>
  <div class="sec" style="top:350px">Relationships</div>
  <div class="tag">A</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":440}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
