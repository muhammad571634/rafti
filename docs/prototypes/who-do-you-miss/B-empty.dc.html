<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breathing seats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
body{margin:0}
.ph{width:390px;height:440px;background:#09090D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Roboto,'Segoe UI',Helvetica,Arial,sans-serif;overflow:hidden;position:relative}
.feat{position:absolute;left:20px;top:-150px;width:262px;height:240px;border-radius:28px;background:linear-gradient(180deg,#3a2a20,#1a1410)}
.sec{position:absolute;left:20px;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:22px;line-height:28px;letter-spacing:-.25px}
.row{position:absolute;left:20px;top:176px;display:flex;gap:12px}
.seat{width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:inherit;font:inherit}
.disc{width:64px;height:64px;border-radius:32px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
.lab{font-size:12px;line-height:16px;color:rgba(235,235,245,.62);text-align:center}
.tag{position:absolute;top:110px;right:16px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#09090D;background:#FFC497;border-radius:10px;padding:3px 8px}
</style>
</helmet>
<div class="ph">
  <div class="feat"></div>
  <div class="sec" style="top:124px">Who do you miss?</div>
  <div class="row">
    <sc-for list="{{ seats }}" as="r" hint-placeholder-count="5">
      <button class="seat" aria-label="Choose your {{ r.label }}">
        <div class="disc" style="{{ r.ground }}">
          <svg width="46" height="52" viewBox="0 0 60 68" aria-hidden="true"><defs><linearGradient id="s{{ $index }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{ r.hue }}"></stop><stop offset="1" stop-color="{{ r.hue }}" stop-opacity=".2"></stop></linearGradient></defs><circle cx="30" cy="22" r="{{ r.head }}" fill="url(#s{{ $index }})"></circle><path d="M6 68 C6 49 17 40 30 40 C43 40 54 49 54 68 Z" fill="url(#s{{ $index }})"></path></svg>
        </div>
        <div class="lab">{{ r.label }}</div>
      </button>
    </sc-for>
  </div>
  <div class="sec" style="top:330px">Relationships</div>
  <div class="tag">B</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    const seat = (label, hue, head, delay) => ({ label, hue, head, ground: 'background: radial-gradient(circle at 50% 70%, ' + hue + '40, ' + hue + '14 70%); animation-delay: ' + delay + 's' });
    return {
      seats: [
        seat('Mom', '#E8749C', 12, 0),
        seat('Dad', '#6E9BFF', 12, 0.8),
        seat('Big sister', '#A893F0', 12, 1.6),
        seat('Big brother', '#5FC3D3', 12, 2.4),
        seat('Little sister', '#FF9F4A', 14, 3.2),
      ],
    };
  }
}
</script>
</body>
</html>
