.row{display:flex;align-items:center;gap:12px;padding:0 14px;height:52px}
.row + .row .rb{border-top:.5px solid rgba(84,84,88,.6)}
.ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.rb{flex:1;align-self:stretch;display:flex;align-items:center;gap:8px}
.rt{flex:1;font-size:17px}
.rv{font-size:17px;color:rgba(235,235,245,.55)}
.tag{position:absolute;top:44px;right:16px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#09090D;background:#FFC497;border-radius:10px;padding:3px 8px}
